<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Eloy motion</title>
<style>
__FONTS__
:root{--blue:#1B66F7;--blue2:#3D8BFF;--bg:#EAF1FE;--ink:#0B1220;--muted:#4A5672;--red:#F04A5A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0B1220}
body{display:flex;justify-content:center;align-items:flex-start}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:J,Inter,sans-serif;color:var(--ink);transform-origin:top center}
.abs{position:absolute;left:0;top:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#b1{width:760px;height:760px;background:#BFD5FF}
#b2{width:620px;height:620px;background:#D6E5FF}
.hl{left:80px;top:290px;width:920px;font-weight:800;font-size:96px;line-height:1.08;letter-spacing:-2px}
.hl .ln{display:block;overflow:hidden;padding-bottom:8px}
.hl .ln span{display:inline-block}
.hl em{font-style:normal;color:var(--blue)}
.hl.w{color:#fff}
.hl.w em{color:var(--red)}
#pill{left:80px;top:180px;padding:16px 30px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:34px;box-shadow:0 10px 30px rgba(27,102,247,.12);display:flex;align-items:center;gap:14px}
#pill i{width:14px;height:14px;border-radius:50%;background:var(--blue);display:block}
#mark,#wm{left:780px;top:186px;width:220px}
#wm{opacity:.4}
/* dark */
#darkWrap{width:1080px;height:1920px}
#dark{width:1080px;height:1920px;background:radial-gradient(120% 80% at 50% 30%,#16213A 0%,#0B1220 70%)}
#rg{width:900px;height:900px;border-radius:50%;filter:blur(120px);background:var(--red);opacity:0}
#pcard{left:80px;top:600px;width:920px;border-radius:40px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08);padding:34px 40px 40px}
#pcard .hd{color:#fff;font-weight:700;font-size:38px;display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
#pcard .hd span{color:rgba(255,255,255,.5);font-weight:500;font-size:28px}
.pchip{display:flex;align-items:center;gap:22px;padding:20px 24px;border-radius:24px;background:rgba(240,74,90,.12);border:2px solid rgba(240,74,90,.45);color:#fff;font-weight:700;font-size:40px;margin-top:16px}
.pchip .ic{width:70px;height:70px;flex:none;border-radius:20px;background:var(--red);display:flex;align-items:center;justify-content:center}
.pchip .ic svg{width:40px;height:40px;stroke:#fff}
.gauge{left:80px;width:920px;padding:32px 40px;border-radius:36px}
.gauge .lb{font-weight:700;font-size:36px;display:flex;justify-content:space-between;align-items:center}
.gauge .lb span{font-weight:500;font-size:28px}
.gauge .tr{height:48px;border-radius:999px;margin-top:20px;overflow:hidden}
.gauge .fl{height:100%;border-radius:999px;width:100%}
#gD{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08);color:#fff}
#gD .tr{background:rgba(255,255,255,.1)}
#gD .lb span{color:var(--red)}
#solQ{width:1080px;top:820px;text-align:center;color:#fff;font-weight:800;font-size:120px;letter-spacing:-3px}
/* light */
#solT{width:1080px;top:680px;text-align:center}
#solT .k{display:inline-block;padding:16px 34px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:44px;box-shadow:0 12px 30px rgba(27,102,247,.15)}
#solT .b{font-weight:800;font-size:126px;line-height:1.02;letter-spacing:-4px;color:var(--ink);margin-top:34px;padding:0 60px}
#solT .b em{font-style:normal;color:var(--blue)}
.step{left:80px;width:920px;min-height:190px;background:#fff;border-radius:36px;box-shadow:0 18px 40px rgba(11,18,32,.08);display:flex;align-items:center;gap:30px;padding:28px 36px}
.step .bi{width:104px;height:104px;flex:none;border-radius:30px;background:var(--blue);display:flex;align-items:center;justify-content:center;position:relative}
.step .bi svg{width:56px;height:56px;stroke:#fff}
.step .n{position:absolute;top:-12px;right:-12px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
.step .w1{font-weight:800;font-size:46px;letter-spacing:-1px;line-height:1.1}
.step .w2{font-weight:500;font-size:33px;color:var(--muted);margin-top:6px;line-height:1.25}
#gL{background:#fff;box-shadow:0 18px 40px rgba(11,18,32,.08);top:640px}
#gL .tr{background:var(--bg);height:62px}
#gL .lb span{color:var(--blue)}
#chips{left:80px;top:900px;width:920px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.cp{padding:16px 24px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:32px;box-shadow:0 10px 24px rgba(11,18,32,.08);display:flex;align-items:center;gap:10px}
.cp i{width:14px;height:14px;border-radius:50%;background:var(--blue);display:block}
#breath{left:70px;width:940px;top:1110px;text-align:center;font-weight:800;font-size:64px;letter-spacing:-1.5px;color:var(--blue);line-height:1.12}
.ring{width:900px;height:900px;border-radius:50%;border:4px solid rgba(61,139,255,.45)}
.chk{left:80px;width:920px;display:flex;align-items:center;gap:34px}
.chk .c{width:96px;height:96px;flex:none;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(27,102,247,.3)}
.chk .c svg{width:52px;height:52px}
.chk .w1{font-weight:800;font-size:50px;letter-spacing:-1px;line-height:1.1}
.chk .w2{font-weight:500;font-size:33px;color:var(--muted);margin-top:4px}
.ter{top:1215px;padding:18px 30px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:34px;box-shadow:0 10px 26px rgba(27,102,247,.14)}
#legal{left:70px;width:940px;top:1395px;text-align:center;font-weight:600;font-size:28px;line-height:1.4;color:var(--ink)}
/* end */
#end{width:1080px;height:1920px;background:var(--blue);color:#fff}
#logo{left:270px;top:330px;width:540px}
#tag{width:1080px;top:640px;text-align:center;font-weight:700;font-size:44px;line-height:1.25;padding:0 80px}
#ctaT{width:1080px;top:770px;text-align:center;font-weight:800;font-size:64px;letter-spacing:-1.5px}
#url{left:90px;width:900px;top:870px;padding:26px 20px;border-radius:32px;background:#fff;color:var(--blue);text-align:center;font-weight:800;font-size:40px;line-height:1.2;box-shadow:0 20px 44px rgba(0,0,0,.18)}
#url small{display:block;font-weight:600;font-size:32px;color:var(--muted);margin-top:4px}
#bio{left:390px;width:300px;top:1020px;padding:14px 0;border-radius:999px;background:#0B1220;color:#fff;text-align:center;font-weight:800;font-size:32px}
#ou{width:1080px;top:1120px;text-align:center;font-weight:600;font-size:36px;opacity:.9}
#tel{left:220px;width:640px;top:1180px;height:120px;border-radius:999px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:22px;font-weight:800;font-size:58px;letter-spacing:-1px}
#tel svg{width:48px;height:48px}
#legalEnd{left:80px;width:920px;top:1345px;text-align:center;font-weight:500;font-size:27px;line-height:1.42;color:#EAF1FE}
#legalEnd .o{display:block;margin-top:14px;font-size:25px;opacity:.85}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const SPEC=__SPEC__;
const T=__T__;
const LOGO_BLEU="__LOGO_BLEU__", LOGO_BLANC="__LOGO_BLANC__";
const D=T.end;
const ICONS={
 doc:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',
 euro:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4 4 0 100 7M7 11h6M7 13.5h6"/>',
 percent:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
 down:'<path d="M3 6l7 7 4-4 7 7"/><path d="M21 11v5h-5"/>',
 up:'<path d="M3 18l7-7 4 4 7-7"/><path d="M21 13V8h-5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 car:'<path d="M5 16l1.5-5h11L19 16"/><rect x="3" y="16" width="18" height="4" rx="1"/>',
 card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>',
 briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 13h18"/>',
 factory:'<path d="M3 20V10l6 4V10l6 4V6l6 4v10z"/><path d="M7 17h2M12 17h2M17 17h2"/>',
 truck:'<rect x="2" y="7" width="12" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
 tools:'<path d="M4 15a8 8 0 0116 0"/><path d="M2 15h20v3H2zM12 4v4M9 6l1 3M15 6l-1 3"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 6 2 6 5"/>',
 heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',
 piggy:'<path d="M5 11a7 6 0 0113-2l2-1v4l-1 1a7 6 0 01-3 4v3h-3v-2h-2v2H8v-3a6 6 0 01-3-6z"/><circle cx="15" cy="10" r=".8"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
 umbrella:'<path d="M3 12a9 9 0 0118 0z"/><path d="M12 12v7a2 2 0 01-4 0"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
 building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/>'
};
const svg=(k,w=2.2)=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.check}</svg>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const emph=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const lines=(id,arr,cls)=>`<div id="${id}" class="hl ${cls||''} abs">${arr.map(l=>`<span class="ln"><span>${emph(l)}</span></span>`).join('')}</div>`;
const A=k=>(k in T)?T[k]:null;

/* ---------- build DOM ---------- */
const P=SPEC.douleur, X=SPEC.explication, B=SPEC.benefice, E=SPEC.eloy, C=SPEC.cta;
let h='<div class="blob" id="b1"></div><div class="blob" id="b2"></div>';
h+=`<div id="pill" class="abs"><i></i>${esc(SPEC.rubrique)}</div><img id="mark" class="abs" src="${LOGO_BLEU}">`;
h+=`<div id="solT" class="abs"><div class="k">${esc(SPEC.solution.kicker||'La solution')}</div><div class="b">${SPEC.solution.l.map(emph).join('<br>')}</div></div>`;
h+=lines('hX',X.titre); h+=lines('hB',B.titre); h+=lines('hE',E.titre);
X.etapes.forEach((s,i)=>{h+=`<div class="step abs" id="x${i}"><div class="bi">${svg(s.i)}<div class="n">${i+1}</div></div><div><div class="w1">${emph(s.t)}</div><div class="w2">${esc(s.s||'')}</div></div></div>`});
h+=`<div class="gauge abs" id="gL"><div class="lb">${esc(B.jauge.label)} <span id="gLs">${esc(B.jauge.badge||'')}</span></div><div class="tr"><div class="fl" id="gLf"></div></div></div>`;
h+=`<div id="chips" class="abs">${(B.puces||[]).map((c,i)=>`<div class="cp" id="h${i}"><i></i>${esc(c)}</div>`).join('')}</div>`;
h+=`<div id="breath" class="abs">${emph(B.phrase.t)}</div>`;
h+='<div class="ring abs" id="r0"></div><div class="ring abs" id="r1"></div><div class="ring abs" id="r2"></div>';
E.checks.forEach((c,i)=>{h+=`<div class="chk abs" id="k${i}"><div class="c">${svg('check',3).replace('fill="none"','fill="none" stroke="#fff"')}</div><div><div class="w1">${emph(c.t)}</div><div class="w2">${esc(c.s||'')}</div></div></div>`});
(E.territoires||[]).forEach((t,i)=>{h+=`<div class="ter abs" id="t${i}">${esc(t)}</div>`});
h+=`<div id="legal" class="abs">${esc(SPEC.legal||'')}</div>`;
/* dark */
h+='<div id="darkWrap" class="abs"><div id="dark" class="abs"></div><div id="rg" class="abs"></div>';
h+=`<img id="wm" class="abs" src="${LOGO_BLANC}"><div id="solQ" class="abs">${esc(SPEC.question.t)}</div>`;
P.titres.forEach((ti,i)=>{h+=lines('hP'+i,ti.l,'w')});
if(P.carte){h+=`<div id="pcard" class="abs"><div class="hd">${esc(P.carte.titre)} <span>${esc(P.carte.sous||'')}</span></div>${P.carte.puces.map((c,i)=>`<div class="pchip" id="pc${i}"><div class="ic">${svg(c.i)}</div>${esc(c.t)}</div>`).join('')}</div>`}
if(P.jauge){h+=`<div class="gauge abs" id="gD"><div class="lb">${esc(P.jauge.label)} <span id="gDs"></span></div><div class="tr"><div class="fl" id="gDf"></div></div></div>`}
h+='</div>';
/* end */
const page=C.page||'/contact';
h+=`<div id="end" class="abs"><img id="logo" class="abs" src="${LOGO_BLANC}"><div id="tag" class="abs">${esc(C.tag||SPEC.rubrique)}</div>
<div id="ctaT" class="abs">${esc(C.titre||'Faites votre simulation')}</div>
<div id="url" class="abs">eloy-assurances-patrimoine.fr<small>${esc(page)}</small></div>
<div id="bio" class="abs">Lien en bio</div><div id="ou" class="abs">ou appelez au</div>
<div id="tel" class="abs"><svg viewBox="0 0 24 24" fill="none" stroke="#1B66F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICONS.phone}</svg>06 96 33 29 09</div>
<div id="legalEnd" class="abs">${esc(SPEC.legal_fin||SPEC.legal||'')}<span class="o">Eloy · Courtier · ORIAS n° 23 000 527 – www.orias.fr</span></div></div>`;
document.getElementById('stage').innerHTML=h;

/* ---------- animation helpers ---------- */
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>cl((t-s)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function set(el,{x=0,y=0,s=1,r=0,o=1}){if(!el)return;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
function headline(id,t,tin,tout){
  const el=$(id); if(!el)return;
  const ls=el.querySelectorAll('.ln > span');
  el.style.opacity=(t<tin-0.05||t>tout+0.7)?0:1;
  ls.forEach((sp,i)=>{const a=eo(p(t,tin+i*0.12,0.55)),b=eio(p(t,tout+i*0.06,0.45));sp.style.transform=`translateY(${(1-a)*120-b*120}%)`});
}
const s0=T[SPEC.question.de], sol=T[SPEC.solution.de], rc=T[X.de], r=T[B.de], br=T[B.phrase.de], e=T[E.de], cta=T[C.de];
const bio=A(C.bio)??cta+1.5, tel=A(C.tel)??cta+2.5;
const painT=P.titres.map(x=>T[x.de]);

function render(t){
  set($('b1'),{x:-260+Math.sin(t*0.35)*80,y:-200+Math.cos(t*0.3)*60});
  set($('b2'),{x:620+Math.cos(t*0.4)*70,y:1250+Math.sin(t*0.33)*90});
  /* dark phase */
  const wipe=eio(p(t,sol-0.15,0.8));
  $('darkWrap').style.clipPath=`circle(${1500*(1-wipe)}px at 540px 900px)`;
  $('darkWrap').style.opacity=wipe>=1?0:1;
  set($('wm'),{o:0.4*eo(p(t,0.2,0.6))});
  P.titres.forEach((x,i)=>headline('hP'+i,t,painT[i]+0.05,(i+1<painT.length?painT[i+1]:s0)-0.4));
  const pf=eio(p(t,s0-0.3,0.4));
  const lastP=painT[painT.length-1];
  const shake=(t>lastP+0.3&&t<s0)?Math.sin(t*38)*5*cl((t-lastP-0.3)/1.5)*(1-p(t,s0-0.8,0.6)):0;
  if(P.carte){
    const ci=eo(p(t,painT[0],0.6));
    const top=P.jauge?560:640;
    set($('pcard'),{y:top-600+(1-ci)*80-pf*60,x:shake,o:ci*(1-pf)});
    P.carte.puces.forEach((c,i)=>{const at=T[c.de]+(c.decal||0.15);const a=eb(p(t,at,0.45));const el=$('pc'+i);el.style.transform=`translateX(${(1-a)*-60}px) scale(${0.85+0.15*a})`;el.style.opacity=cl(p(t,at,0.12))});
  }
  if(P.jauge){
    const gs=T[P.jauge.de];const gi=eo(p(t,gs,0.5));
    const n=P.carte?P.carte.puces.length:0;const gy=P.carte?(560+130+n*126+40):1000;
    $('gD').style.top=gy+'px';
    set($('gD'),{y:(1-gi)*60+pf*60,o:gi*(1-pf)});
    const dr=eio(p(t,gs+0.5,2.2)),lv=1-0.9*dr,fl=$('gDf');
    fl.style.width=(lv*100)+'%';
    fl.style.background=`rgb(${Math.round(61+179*dr)},${Math.round(139-65*dr)},${Math.round(255-165*dr)})`;
    $('gDs').textContent=dr>0.85?(P.jauge.etat||''):'';
  }
  const alarm=t>lastP&&t<s0-0.2?(0.5+0.5*Math.sin(t*6))*0.22:0;
  set($('rg'),{x:90,y:1000,o:alarm});
  const sq=eb(p(t,s0,0.5)); set($('solQ'),{y:(1-sq)*40,s:0.8+0.2*sq,o:cl(p(t,s0,0.15))});
  /* reveal */
  const so=eb(p(t,sol+0.15,0.6)), sx=eio(p(t,rc-0.35,0.35));
  set($('solT'),{y:(1-so)*50-sx*80,s:0.85+0.15*so,o:cl(p(t,sol+0.15,0.2))*(1-sx)});
  const pin=eo(p(t,rc+0.2,0.5)), pout=eio(p(t,cta-0.1,0.3));
  set($('pill'),{y:(1-pin)*-30,o:pin*(1-pout)});
  const mk=eo(p(t,sol+0.1,0.5)); set($('mark'),{y:(1-mk)*-20,o:mk*(1-pout)});
  /* explication */
  headline('hX',t,rc,r-0.4);
  const xo=eio(p(t,r-0.4,0.35));
  X.etapes.forEach((s,i)=>{const at=(A(s.de)??rc+0.4+i*0.9)+(i===0?0.35:0);const a=eo(p(t,at,0.55));
    set($('x'+i),{x:(1-a)*-90,y:600+i*226-xo*40,o:a*(1-xo)});
    $('x'+i).querySelector('.bi').style.transform=`scale(${0.5+0.5*eb(p(t,at+0.05,0.5))})`});
  /* benefice */
  headline('hB',t,r,e-0.4);
  const go=eio(p(t,e-0.4,0.35)), gl=eo(p(t,r+0.15,0.5));
  set($('gL'),{y:(1-gl)*50-go*40,o:gl*(1-go)});
  const fill=eio(p(t,r+0.4,1.3)), gf=$('gLf');
