name: Medias Flora
# Copie dans le dépôt des fichiers générés par Flora ou ElevenLabs (hôtes media.flora.ai et storage.googleapis.com/xi-backend seulement).
# liste = "nom1.ext=https://media.flora.ai/... nom2.ext=https://media.flora.ai/..." ; dossier = media/<sous-dossier> ou dist/img/photos ou dist/video
on:
  workflow_dispatch:
    inputs:
      liste:
        description: "nom.ext=url séparés par des espaces"
        required: true
      dossier:
        description: "Dossier de destination"
        required: true
        default: "media"
permissions:
  contents: write
jobs:
  copier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        env:
          LISTE: ${{ inputs.liste }}
          DOSSIER: ${{ inputs.dossier }}
        run: |
          echo "$DOSSIER" | grep -Eq '^(media(/[A-Za-z0-9._-]+)?|dist/img/photos|dist/video)$' || { echo "dossier refusé"; exit 1; }
          mkdir -p "$DOSSIER"
          for item in $LISTE; do
            nom="${item%%=*}"; url="${item#*=}"
            echo "$nom" | grep -Eq '^[A-Za-z0-9._-]{1,80}\.(png|jpg|jpeg|webp|mp3|wav|mp4|mov)$' || { echo "nom invalide: $nom"; exit 1; }
            case "$url" in https://media.flora.ai/*|https://storage.googleapis.com/xi-backend/*) ;; *) echo "hôte refusé"; exit 1;; esac
            curl -fsSL --max-filesize 60000000 "$url" -o "$DOSSIER/$nom"
            file "$DOSSIER/$nom" | grep -Eqi 'PNG|JPEG|WebP|Audio|MPEG|ISO Media|WAVE|QuickTime' || { echo "type refusé: $nom"; exit 1; }
          done
      - name: Enregistrer
        env:
          DOSSIER: ${{ inputs.dossier }}
        run: |
          git config user.name "eloy-bot"
          git config user.email "eloy-bot@users.noreply.github.com"
          git add "$DOSSIER"
          git commit -m "Médias Flora ($DOSSIER)" && git pull --rebase && git push
